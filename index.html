<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store - Loja de Roupas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: flex;
            min-height: 500px;
        }

        .products {
            flex: 1;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            overflow-y: auto;
        }

        .product {
            background: #f8f9fa;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            color: white;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .product-price {
            color: #667eea;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-add {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .btn-add:hover {
            opacity: 0.9;
        }

        .cart {
            width: 300px;
            background: #f8f9fa;
            padding: 30px;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .cart-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .cart-item-name {
            font-weight: bold;
            flex: 1;
        }

        .cart-item-price {
            color: #667eea;
            font-weight: bold;
        }

        .cart-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 1.1em;
        }

        .cart-total {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .cart-total-label {
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .cart-total-value {
            font-size: 2em;
            font-weight: bold;
        }

        .btn-checkout {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s;
        }

        .btn-checkout:hover {
            background: #218838;
        }

        .btn-clear {
            width: 100%;
            padding: 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-clear:hover {
            background: #c82333;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .cart {
                width: 100%;
                border-left: none;
                border-top: 1px solid #ddd;
            }
        }

        .badge {
            display: inline-block;
            background: #dc3545;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👗 Fashion Store</h1>
            <p class="subtitle">Sua loja de roupas online</p>
        </header>

        <div class="content">
            <div class="products" id="products"></div>
            <div class="cart">
                <div class="cart-title">🛒 Carrinho <span class="badge" id="cartCount">0</span></div>
                <div class="cart-items" id="cartItems">
                    <div class="cart-empty">Carrinho vazio</div>
                </div>
                <div class="cart-total">
                    <div class="cart-total-label">Total</div>
                    <div class="cart-total-value" id="cartTotal">R$ 0,00</div>
                </div>
                <button class="btn-checkout" onclick="checkout()">Comprar Agora</button>
                <button class="btn-clear" onclick="clearCart()">Limpar Carrinho</button>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Camiseta Azul', price: 49.90, emoji: '👕' },
            { id: 2, name: 'Calça Jeans', price: 89.90, emoji: '👖' },
            { id: 3, name: 'Vestido Floral', price: 129.90, emoji: '👗' },
            { id: 4, name: 'Jaqueta Couro', price: 199.90, emoji: '🧥' },
            { id: 5, name: 'Tênis Branco', price: 159.90, emoji: '👟' },
            { id: 6, name: 'Sapato Social', price: 189.90, emoji: '👞' },
            { id: 7, name: 'Boné Preto', price: 39.90, emoji: '🧢' },
            { id: 8, name: 'Bolsa Grande', price: 99.90, emoji: '👜' },
        ];

        let cart = [];

        function renderProducts() {
            const productsDiv = document.getElementById('products');
            productsDiv.innerHTML = products.map(p => `
                <div class="product">
                    <div class="product-image">${p.emoji}</div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">R$ ${p.price.toFixed(2)}</div>
                        <button class="btn-add" onclick="addToCart(${p.id})">Adicionar</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({...product, quantity: 1});
            }

            updateCart();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartCountDiv = document.getElementById('cartCount');
            const cartTotalDiv = document.getElementById('cartTotal');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="cart-empty">Carrinho vazio</div>';
                cartCountDiv.textContent = '0';
                cartTotalDiv.textContent = 'R$ 0,00';
                return;
            }

            cartItemsDiv.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div class="cart-item-name">${item.name} x${item.quantity}</div>
                    <div>
                        <div class="cart-item-price">R$ ${(item.price * item.quantity).toFixed(2)}</div>
                        <button onclick="removeFromCart(${index})" style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-top: 5px; width: 100%;">Remove</button>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartCountDiv.textContent = cart.length;
            cartTotalDiv.textContent = `R$ ${total.toFixed(2)}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function clearCart() {
            cart = [];
            updateCart();
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Seu carrinho está vazio!');
                return;
            }
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            alert(`✅ Compra realizada com sucesso!\n\nTotal: R$ ${total.toFixed(2)}\n\nObrigado por comprar na Fashion Store!`);
            clearCart();
        }

        renderProducts();
    </script>
</body>
</html>
